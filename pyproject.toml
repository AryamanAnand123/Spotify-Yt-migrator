[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spottoyt"
version = "0.1.0"
description = "Archive a Spotify library and review migrations to YouTube Music."
requires-python = ">=3.12"
dependencies = ["typer>=0.15,<1", "spotipy==2.26.0", "ytmusicapi==1.12.3", "keyring==25.7.0", "streamlit==1.67.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "playwright==1.65.2"]

[project.scripts]
spottoyt = "spottoyt.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
